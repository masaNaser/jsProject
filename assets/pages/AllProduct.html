<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Product</title>
    <link href="../css/outputs.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
      <header class="bg-white/80 backdrop-blur-md border-b border-zinc-100 sticky top-0 z-50 transition-all duration-300">
      <div class="container mx-auto px-6">
        <div class="flex justify-between items-center py-5">
          <a href="../../index.html" class="cursor-pointer group">
            <h1 class="font-black text-2xl tracking-[0.2em] text-zinc-900 group-hover:text-zinc-600 transition-colors">LUXE & CO</h1>
          </a>

          <nav class="hidden md:block">
            <ul class="flex gap-10 items-center font-medium text-sm tracking-wide uppercase text-zinc-600">
              <li>
                <a href="../../index.html" class="hover:text-zinc-950 transition relative after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-zinc-900 hover:after:w-full after:transition-all">Home</a>
              </li>
              <li>
                <a href="../../assets/pages/category.html" class="hover:text-zinc-950 transition relative after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-zinc-900 hover:after:w-full after:transition-all">Category</a>
              </li>
              <li>
                <a href="../../assets/pages/AllProduct.html" class="hover:text-zinc-950 transition relative after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-zinc-900 hover:after:w-full after:transition-all">Product</a>
              </li>
            </ul>
          </nav>

          <div class="flex gap-4 items-center">
            <div class="lg:flex hidden bg-zinc-50 border border-zinc-200/80 px-4 py-2 rounded-full items-center transition-all focus-within:border-zinc-400 focus-within:bg-white w-64">
              <input
                id="search-desktop"
                type="text"
                class="bg-transparent outline-none text-xs w-full text-zinc-800 placeholder-zinc-400"
                placeholder="Search collection..."
              />
              <i class="fa-solid fa-magnifying-glass text-zinc-400 text-xs"></i>
            </div>

            <div class="flex gap-4 text-zinc-800">
              <button
                id="menu-btn"
                class="md:hidden text-xl focus:outline-none hover:opacity-70 transition"
              >
                <i class="fa-solid fa-bars" id="menu-icon"></i>
              </button>
            </div>
          </div>
        </div>

        <div
          id="mobile-menu"
          class="hidden md:hidden pb-6 transition-all duration-300"
        >
          <nav class="flex flex-col gap-3 font-medium text-sm bg-zinc-50 p-6 rounded-2xl border border-zinc-100">
            <a href="./index.html" class="hover:text-zinc-950 py-2 border-b border-zinc-200/50">Home</a>
            <a href="./assets/pages/category.html" class="hover:text-zinc-950 py-2 border-b border-zinc-200/50">Category</a>
            <a href="./assets/pages/AllProduct.html" class="hover:text-zinc-950 py-2">Product</a>

            <div class="flex lg:hidden bg-white border border-zinc-200 px-4 py-2.5 rounded-full items-center mt-3">
              <input
                id="search-mobile"
                type="text"
                class="bg-transparent outline-none text-xs w-full text-zinc-800"
                placeholder="Search collection..."
              />
              <i class="fa-solid fa-magnifying-glass text-zinc-400 text-xs"></i>
            </div>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="mt-5">
        <div class="container mx-auto px-4">
        <div class="mb-6 flex justify-between items-center">
          <span class="text-sm text-gray-500 total_product"></span>

          <select
            id="sort-select"
            class="border border-gray-200 rounded-md px-3 py-2 text-sm text-gray-700 outline-none cursor-pointer hover:border-primary transition"
          >
            <option value="price-asc">Lowest Price</option>
            <option value="price-desc">Highest Price</option>
          </select>
        </div>
      </div>
      </section>

      <section class="py-8 bg-gray-50">
        <div class="container mx-auto px-4">
          <div class="mb-6">
            <span class="text-sm text-gray-500 total_product"></span>
          </div>
          <div
            class="products grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"
          ></div>
          <div
            class="pagination-controls flex justify-center items-center gap-2 mt-8 mb-8"
          ></div>
        </div>
      </section>
    </main>

    <footer class="w-full py-10 border-t border-gray-100 bg-white mt-20">
      <div class="container mx-auto px-4 text-center">
        <p class="text-sm text-gray-500 italic">
          &copy; 2026
          <span class="font-bold text-gray-800 not-italic">LUXE & CO</span>. All
          rights reserved.
        </p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/AllProduct.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
