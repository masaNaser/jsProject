
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="../css/outputs.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
</head>
<body>
    <header class="bg-white/80 backdrop-blur-md border-b border-zinc-100 sticky top-0 z-50 transition-all duration-300">
      <div class="container mx-auto px-6">
        <div class="flex justify-between items-center py-5">
          <a href="../../index.html" class="cursor-pointer group">
            <h1 class="font-black text-2xl tracking-[0.2em] text-zinc-900 group-hover:text-zinc-600 transition-colors">
              LUXE & CO
            </h1>
          </a>

          <nav class="hidden md:block">
            <ul
              class="flex gap-10 items-center font-medium text-sm tracking-wide uppercase text-zinc-600"
            >
              <li>
                <a
                  href="./register.html"
                  class="hover:text-zinc-950 transition relative after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-zinc-900 hover:after:w-full after:transition-all"
                  >Register</a
                >
              </li>
              <li>
                <a
                  href="./login.html"
                  class="hover:text-zinc-950 transition relative after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-zinc-900 hover:after:w-full after:transition-all"
                  >Login</a
                >
              </li>
            </ul>
          </nav>

          <div class="flex gap-4 items-center">
            <div class="flex gap-4 text-zinc-800">
              <button
                id="menu-btn"
                class="md:hidden text-xl focus:outline-none hover:opacity-70 transition"
              >
                <i class="fa-solid fa-bars" id="menu-icon"></i>
              </button>
            </div>
          </div>
        </div>

        <div
          id="mobile-menu"
          class="hidden md:hidden pb-6 transition-all duration-300"
        >
          <nav
            class="flex flex-col gap-3 font-medium text-sm bg-zinc-50 p-6 rounded-2xl border border-zinc-100"
          >
            <a
              href="./register.html"
              class="hover:text-zinc-950 py-2 border-b border-zinc-200/50"
              >Register</a
            >
            <a
              href="./login.html"
              class="hover:text-zinc-950 py-2"
              >Login</a
            >
          </nav>
        </div>
      </div>
    </header>
    <main>
        <section>
         <form id="loginForm" class="flex flex-col gap-4 m-auto mt-10 w-full max-w-sm">
           <input type="text" id="Username" placeholder="Username" class="border p-2 rounded " required>
           <input type="password" id="Password" placeholder="Password" class="border p-2 rounded" required>
           <button type="submit" class="bg-primary text-white p-2 rounded cursor-pointer">Login</button>
        </form>
        <div class="mt-6 p-4 bg-amber-50/60 border border-amber-200/70 rounded-lg text-xs text-amber-800 leading-relaxed">
          <p class="font-semibold mb-1">💡 ملاحظة للمُقيّم:</p>
          بسبب استخدام API تجريبي (DummyJSON)، يرجى استخدام الحساب الجاهز التالي لتجربة لوحة التحكم والميزات المحمية بالكامل:
          <div class="mt-2 font-mono bg-white p-2 rounded border border-amber-100 flex justify-around text-gray-750">
            <span>User: <strong class="text-black">emilys</strong></span>
            <span>Pass: <strong class="text-black">emilyspass</strong></span>
          </div>
        </div>
        </section>
    </main>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../js/login.js"></script>
</body>

</html>
