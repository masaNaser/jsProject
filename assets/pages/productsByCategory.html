<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxe & Co</title>
    <link href="../css/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="bg-white shadow-sm sticky top-0 z-50">
      <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
          <a href="../../index.html" class="cursor-pointer">
            <h1 class="font-bold text-2xl tracking-tight">LUXE & CO</h1>
          </a>

          <nav class="hidden md:block">
            <ul class="flex gap-8 items-center font-medium">
              <li>
                <a href="../../index.html" class="hover:text-primary transition"
                  >Home</a
                >
              </li>
              <li>
                <a
                  href="../../assets/pages/category.html"
                  class="hover:text-primary transition"
                  >Category</a
                >
              </li>
              <li>
                <a
                  href="../../assets/pages/AllProduct.html"
                  class="hover:text-primary transition"
                  >Product</a
                >
              </li>
            </ul>
          </nav>

          <div class="flex gap-4 items-center">
            <div
              class="lg:flex hidden bg-white border p-2 rounded-md items-center mt-2"
            >
              <input
                type="text"
                class="bg-transparent outline-none text-sm w-full"
                placeholder="Search..."
              />
              <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
            </div>

            <div class="flex gap-4 text-lg text-gray-700">
              <a href="#" class="hover:text-primary"
                ><i class="fa-solid fa-cart-shopping"></i
              ></a>
              <a href="#" class="hover:text-primary"
                ><i class="fa-regular fa-user"></i
              ></a>

              <button
                id="menu-btn"
                class="md:hidden text-2xl focus:outline-none"
              >
                <i class="fa-solid fa-bars" id="menu-icon"></i>
              </button>
            </div>
          </div>
        </div>

        <div
          id="mobile-menu"
          class="hidden md:hidden pb-4 transition-all duration-300"
        >
          <nav
            class="flex flex-col gap-4 font-semibold text-center bg-gray-50 p-6 rounded-xl"
          >
            <a
              href="./index.html"
              class="hover:text-primary py-2 border-b border-gray-100"
              >Home</a
            >
            <a
              href="./assets/pages/category.html"
              class="hover:text-primary py-2 border-b border-gray-100"
              >Category</a
            >
            <a
              href="./assets/pages/products.html"
              class="hover:text-primary py-2"
              >Product</a
            >

            <div
              class="flex lg:hidden bg-white border p-2 rounded-md items-center mt-2"
            >
              <input
                type="text"
                class="bg-transparent outline-none text-sm w-full"
                placeholder="Search..."
              />
              <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
            </div>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="py-8 bg-gray-50">
        <div class="container mx-auto px-4">
          <div class="mb-6">
            <h3
              class="text-xs uppercase tracking-widest text-gray-400 font-bold Category_Name"
            ></h3>
            <span class="text-sm text-gray-500 total_product"></span>
          </div>

          <div class="products grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
        </div>
      </section>
      <section>       
           <div class="pagination-controls flex justify-center items-center gap-2 mt-8 mb-8"></div>
      </section>
    </main>


    <footer class="w-full py-10 border-t border-gray-100 bg-white mt-20">
      <div class="container mx-auto px-4 text-center">
        <p class="text-sm text-gray-500 italic">
          &copy; 2026
          <span class="font-bold text-gray-800 not-italic">LUXE & CO</span>. All
          rights reserved.
        </p>
      </div>
    </footer>
    <script src="../../node_modules/axios/dist/axios.min.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>

  </body>
</html>
